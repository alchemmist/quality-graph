jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: 'false'
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: 'true'
        cache-dependency-glob: uv.lock
    - name: Install locked dependencies
      run: uv sync --locked --all-groups
    - run: make fmt-check
      name: Run Format check
      id: quality-command
      continue-on-error: true
    - name: Collect Format check result
      id: quality-result
      if: always()
      uses: alchemmist/quality-graph@c7522e4fecd84011a36153bd123e2d3b32dac9c2
      with:
        operation: collect
        node-id: format
        title: Format check
        adapter: exit-code
        report-path: ''
        command-outcome: ${{ steps.quality-command.outcome }}
        graph-digest: 4a2b6fc2954aa8864c52a5b0414930569fdd709679b689e8aadbf892413ec178
    - name: Upload Format check result
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: quality-result-format-${{ github.run_attempt }}
        path: ${{ runner.temp }}/quality-graph/format.json
        if-no-files-found: error
        retention-days: 7
    - name: Enforce Format check result
      if: always()
      shell: bash
      env:
        EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
      run: exit "${EXIT_CODE:-2}"
