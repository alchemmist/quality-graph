  format:
    name: Format check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: 'false'
          fetch-depth: '0'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: 'true'
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --all-groups --all-packages
      - run: make fmt-check
        name: Run Format check
        id: quality-command
        continue-on-error: true
      - name: Collect Format check result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@585b63cf6fd2c022160a10a1330be4799e9d5acc
        with:
          operation: collect
          node-id: format
          title: Format check
          adapter: exit-code
          report-path: ''
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: 6b69c8ae96c9dc73b983e837ae9f39b6a1cd950f030beed2db234d44f570d259
          approval-findings: 'true'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload Format check result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-result-format-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/format.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Format check result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
