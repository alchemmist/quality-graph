# Generated by Quality Graph. DO NOT EDIT MANUALLY. Update qg.yaml and run qg generate.
---
name: Quality Graph (push)
'on':
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: quality-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow-graph:
    name: Workflow graph validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: 'false'
          fetch-depth: '0'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: 'true'
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --all-groups --all-packages
      - run: uv run --locked --all-packages python scripts/check_report.py --output reports/workflow-graph.json -- make graph-validate
        name: Run Workflow graph validation
        id: quality-command
        continue-on-error: true
      - name: Collect Workflow graph validation result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@4e24fc581b2e7b9357b62f5e76d60543f3266277
        with:
          operation: collect
          node-id: workflow-graph
          title: Workflow graph validation
          adapter: native
          report-path: reports/workflow-graph.json
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: 12f89838d3c498cb664251858c882cea2d795d148e7ea4fffd680407a381b79d
          approval-findings: 'false'
          approval-files: 'false'
          approval-node: 'false'
          flow-id: main
          operation-id: workflow-graph
          presentation: none
      - name: Upload Workflow graph validation result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-result-workflow-graph-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/workflow-graph.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Workflow graph validation result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
    env:
      QG_FLOW_ID: main
      QG_OPERATION_ID: workflow-graph
      QG_NODE_ID: workflow-graph
      QG_NODE_TITLE: Workflow graph validation
      QG_GRAPH_DIGEST: 12f89838d3c498cb664251858c882cea2d795d148e7ea4fffd680407a381b79d
