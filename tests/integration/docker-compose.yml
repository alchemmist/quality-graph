services:
  fake-github:
    image: quality-graph-fake-github:local
    build:
      context: ../..
      dockerfile: tests/integration/Dockerfile
    environment:
      FAKE_GITHUB_HOST: 0.0.0.0
      FAKE_GITHUB_PORT: "8080"
    ports:
      - "127.0.0.1:${QG_FAKE_GITHUB_PORT:-18080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/health').read()
      interval: 1s
      timeout: 2s
      retries: 20
    stop_grace_period: 1s
    stop_signal: SIGINT
