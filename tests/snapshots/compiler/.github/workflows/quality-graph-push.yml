# Generated by Quality Graph. DO NOT EDIT MANUALLY. Update qg.yaml and run qg generate.
---
name: Quality Graph (push)
'on':
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: quality-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: 'false'
      - uses: astral-sh/setup-uv@v7
      - run: make fmt-check
        name: Run Formatting
        id: quality-command
        continue-on-error: true
      - name: Collect Formatting result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        with:
          operation: collect
          node-id: format
          title: Formatting
          adapter: exit-code
          report-path: ''
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: 8dbcf9c15cddeeabe0b5e603f6ab6cde14ad1cde1d13317963afdfb128eea36b
          approval-findings: 'true'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload Formatting result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-result-format-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/format.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Formatting result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
    env:
      UV_NO_SYNC: '1'
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: 'false'
      - uses: astral-sh/setup-uv@v7
      - run: make lint
        name: Run Lint
        id: quality-command
        continue-on-error: true
      - name: Collect Lint result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        with:
          operation: collect
          node-id: lint
          title: Lint
          adapter: sarif
          report-path: reports/lint.sarif
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: 8dbcf9c15cddeeabe0b5e603f6ab6cde14ad1cde1d13317963afdfb128eea36b
          approval-findings: 'true'
          approval-files: 'true'
          approval-node: 'false'
      - name: Upload Lint result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-result-lint-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/lint.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Lint result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
    needs:
      - format
    env:
      UV_NO_SYNC: '1'
