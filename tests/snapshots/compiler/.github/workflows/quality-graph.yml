# Generated by Quality Graph. Do not edit.
---
name: Quality Graph
'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: quality-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: 'false'
      - uses: astral-sh/setup-uv@v7
      - run: make fmt-check
        name: Run Formatting
        id: quality-command
        continue-on-error: true
      - name: Collect Formatting result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        with:
          operation: collect
          node-id: format
          title: Formatting
          adapter: exit-code
          report-path: ''
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: 3d4354298ece53839809dd5362cd32352e566f9a0e610511756d12bc776cd48a
          approval-findings: 'true'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload Formatting result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-result-format-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/format.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Formatting result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
    env:
      UV_NO_SYNC: '1'
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: 'false'
      - uses: astral-sh/setup-uv@v7
      - run: make lint
        name: Run Lint
        id: quality-command
        continue-on-error: true
      - name: Collect Lint result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        with:
          operation: collect
          node-id: lint
          title: Lint
          adapter: sarif
          report-path: reports/lint.sarif
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: 3d4354298ece53839809dd5362cd32352e566f9a0e610511756d12bc776cd48a
          approval-findings: 'true'
          approval-files: 'true'
          approval-node: 'false'
      - name: Upload Lint result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-result-lint-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/lint.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Lint result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
    needs:
      - format
    env:
      UV_NO_SYNC: '1'
