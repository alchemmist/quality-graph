<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ config.site_description }}">
    <title>{% if not page.is_homepage %}{{ page.title }} · {% endif %}{{ config.site_name }}</title>
    <link rel="stylesheet" href="{{ 'css/site.css' | url }}">
  </head>
  <body class="{% if page.is_homepage %}landing{% else %}documentation{% endif %}">
    {% if page.is_homepage %}
      <main class="landing-content">
        <div class="brand-lockup">
          <img src="{{ 'assets/quality-graph-eye.svg' | url }}" alt="">
          <span>quality—graph</span>
        </div>
        <article>{{ page.content }}</article>
      </main>
    {% else %}
      <nav class="docs-sidebar" aria-label="Documentation">
        {% for section in nav %}
          {% if section.children %}
            <section>
              <strong>{{ section.title }}</strong>
              {% for item in section.children %}
                <a href="{{ item.url | url }}"{% if item.active %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
              {% endfor %}
            </section>
          {% endif %}
        {% endfor %}
      </nav>
      <main class="article">
        {{ page.content }}
      </main>
    {% endif %}
    <a
      class="release-version"
      href="{{ config.repo_url }}/releases/latest"
      aria-label="Latest Quality Graph release: version {{ config.extra.version }}"
    >v{{ config.extra.version }}</a>
  </body>
</html>
