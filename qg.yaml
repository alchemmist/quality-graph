---
version: 0
provider:
  name: github
  configuration:
    merge:
      required: true
    runtime:
      action: alchemmist/quality-graph@b947f26e97ccf1c755050dfe38d98cbb688edb69
      publisher-action: alchemmist/quality-graph@b947f26e97ccf1c755050dfe38d98cbb688edb69

profiles:
  default:
    runner: ubuntu-latest
    setup:
      - uses: actions/checkout@v7
        with:
          persist-credentials: "false"
          fetch-depth: "0"

  python:
    extends: default
    setup:
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: "true"
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --all-groups --all-packages

nodes:
  format:
    title: Format check
    profile: python
    run: make fmt-check

  suppressions:
    title: Lint suppression gate
    profile: python
    needs: [format]
    run: make python-suppressions

  object-annotations:
    title: Python object annotation gate
    profile: python
    needs: [format]
    run: |
      mkdir -p reports
      set -o pipefail
      make python-object-annotations 2>&1 | tee reports/object-annotations.log
    results:
      exit-code: reports/object-annotations.log
    policy:
      approvals:
        node: true

  triple-quotes:
    title: Triple-quoted string style
    profile: python
    needs: [format]
    run: make python-triple-quotes

  no-comments:
    title: Python no-comments policy
    profile: python
    needs: [format]
    run: make python-no-comments

  lint:
    title: Lint
    profile: python
    needs: [suppressions, triple-quotes, no-comments]
    run: make lint

  type:
    title: Type check
    profile: python
    needs: [object-annotations]
    run: make type

  analyze:
    title: Static analysis
    profile: python
    needs: [lint, type]
    run: make analyze

  time-bombs:
    title: Time bomb guardrail
    profile: python
    needs: [analyze]
    run: make python-time-bombs

  test-fast:
    title: Fast tests
    profile: python
    needs: [time-bombs]
    run: make t-fast

  test-medium:
    title: Medium tests
    profile: python
    needs: [time-bombs]
    run: make t-medium

  coverage:
    title: Coverage and diff coverage
    profile: python
    needs: [test-fast, test-medium]
    run: make coverage-diff

  flaky-python:
    title: Changed Python flaky-test detection
    profile: python
    needs: [coverage]
    run: make flaky-python

  mutation:
    title: Changed decision mutation gate
    profile: python
    needs: [flaky-python]
    run: make mutation-diff

  audit:
    title: Dependency and secret audit
    profile: python
    needs: [mutation]
    run: make audit

  package:
    title: Package
    profile: python
    needs: [audit]
    run: make package
