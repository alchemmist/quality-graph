---
version: 0
provider:
  name: github
  configuration:
    merge:
      required: true
    runtime:
      action: alchemmist/quality-graph@3ce9979e67af5899773aac77d1456e710864b6e1
      publisher-action: alchemmist/quality-graph@3ce9979e67af5899773aac77d1456e710864b6e1
profiles:
  default:
    runner: ubuntu-latest
    setup:
    - uses: actions/checkout@v7
      with:
        persist-credentials: 'false'
        fetch-depth: '0'
  python:
    extends: default
    setup:
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: 'true'
        cache-dependency-glob: uv.lock
    - name: Install locked dependencies
      run: uv sync --locked --all-groups --all-packages
  release:
    runner: ubuntu-latest
operations:
  workflow-graph:
    title: Workflow graph validation
    profile: python
    run: uv run --locked --all-packages python scripts/check_report.py --output reports/workflow-graph.json
      -- make graph-validate
    results:
      native: reports/workflow-graph.json
  format:
    title: Format check
    profile: python
    run: uv run --locked --all-packages python scripts/check_report.py --output reports/format.json --
      make fmt-check
    results:
      native: reports/format.json
  suppressions:
    title: Lint suppression gate
    profile: python
    run: uv run --locked --all-packages python scripts/check_report.py --output reports/suppressions.json
      -- make python-suppressions
    results:
      native: reports/suppressions.json
  object-annotations:
    title: Python object annotation gate
    profile: python
    run: uv run --locked --all-packages python scripts/check_report.py --output reports/object-annotations.json
      -- make python-object-annotations
    results:
      native: reports/object-annotations.json
    policy:
      approvals:
        node: true
  triple-quotes:
    title: Triple-quoted string style
    profile: python
    run: uv run --locked --all-packages python scripts/check_report.py --output reports/triple-quotes.json
      -- make python-triple-quotes
    results:
      native: reports/triple-quotes.json
  no-comments:
    title: Python no-comments policy
    profile: python
    run: uv run --locked --all-packages python scripts/check_report.py --output reports/no-comments.json
      -- make python-no-comments
    results:
      native: reports/no-comments.json
  lint:
    title: Lint
    profile: python
    run: uv run --locked --all-packages python scripts/check_report.py --output reports/lint.json -- make
      lint
    results:
      native: reports/lint.json
  type:
    title: Type check
    profile: python
    run: uv run --locked --all-packages python scripts/check_report.py --output reports/type.json -- make
      type
    results:
      native: reports/type.json
  analyze:
    title: Static analysis
    profile: python
    run: uv run --locked --all-packages python scripts/check_report.py --output reports/analyze.json --
      make analyze
    results:
      native: reports/analyze.json
  time-bombs:
    title: Time bomb guardrail
    profile: python
    run: uv run --locked --all-packages python scripts/check_report.py --output reports/time-bombs.json
      -- make python-time-bombs
    results:
      native: reports/time-bombs.json
  test-fast:
    title: Fast tests
    profile: python
    run: make t-fast
    results:
      native: reports/test-fast.json
  test-medium:
    title: Medium tests
    profile: python
    run: make t-medium
    results:
      native: reports/test-medium.json
  coverage:
    title: Coverage and diff coverage
    profile: python
    run: uv run --locked --all-packages python scripts/check_report.py --output reports/coverage.json
      -- make coverage-diff
    results:
      native: reports/coverage.json
  flaky-python:
    title: Changed Python flaky-test detection
    profile: python
    run: uv run --locked --all-packages python scripts/check_report.py --output reports/flaky-python.json
      -- make flaky-python
    results:
      native: reports/flaky-python.json
  mutation:
    title: Changed decision mutation gate
    profile: python
    run: uv run --locked --all-packages python scripts/check_report.py --output reports/mutation.json
      -- make mutation-diff
    results:
      native: reports/mutation.json
  audit:
    title: Dependency and secret audit
    profile: python
    run: uv run --locked --all-packages python scripts/check_report.py --output reports/audit.json --
      make audit
    results:
      native: reports/audit.json
  package:
    title: Package
    profile: python
    run: uv run --locked --all-packages python scripts/check_report.py --output reports/package.json --
      make package
    results:
      native: reports/package.json
  release-build:
    profile: release
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
    - run: uv sync --locked --all-groups
    - name: Verify release version
      run: test "$GITHUB_REF_NAME" = "v$(uv run --locked --all-packages qg --version)"
    - run: make check BASE="$GITHUB_SHA"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: quality-graph-core
        path: dist/quality_graph_core-*
        if-no-files-found: error
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: quality-graph-python
        path: dist/quality_graph_python-*
        if-no-files-found: error
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: quality-graph-github
        path: dist/quality_graph_github-*
        if-no-files-found: error
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: quality-graph-cli
        path: dist/quality_graph_cli-*
        if-no-files-found: error
  publish-core:
    profile: release
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: quality-graph-core
        path: dist
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/quality-graph-core/
  publish-python:
    profile: release
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: quality-graph-python
        path: dist
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
    permissions:
      id-token: write
    environment:
      name: pypi-python
      url: https://pypi.org/project/quality-graph-python/
  publish-github:
    profile: release
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: quality-graph-github
        path: dist
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
    permissions:
      id-token: write
    environment:
      name: pypi-github
      url: https://pypi.org/project/quality-graph-github/
  publish-cli:
    profile: release
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: quality-graph-cli
        path: dist
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
    permissions:
      id-token: write
    environment:
      name: pypi-cli
      url: https://pypi.org/project/quality-graph-cli/
  github-release:
    profile: release
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: quality-graph-*
        path: dist
        merge-multiple: 'true'
    - name: Create immutable GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
    permissions:
      contents: write
flows:
  pull-request:
    trigger: pull-request
    dependencies: graph
    presentation: github-pr
    nodes:
      workflow-graph: {}
      format:
        needs:
        - workflow-graph
      suppressions:
        needs:
        - format
      object-annotations:
        needs:
        - format
      triple-quotes:
        needs:
        - format
      no-comments:
        needs:
        - format
      lint:
        needs:
        - suppressions
        - triple-quotes
        - no-comments
      type:
        needs:
        - object-annotations
      analyze:
        needs:
        - lint
        - type
      time-bombs:
        needs:
        - analyze
      test-fast:
        needs:
        - time-bombs
      test-medium:
        needs:
        - time-bombs
      coverage:
        needs:
        - test-fast
        - test-medium
      flaky-python:
        needs:
        - coverage
      mutation:
        needs:
        - flaky-python
      audit:
        needs:
        - mutation
      package:
        needs:
        - audit
  main:
    trigger:
      push:
        branches:
        - main
    dependencies: graph
    presentation: none
    nodes:
      workflow-graph: {}
      format:
        needs:
        - workflow-graph
      suppressions:
        needs:
        - format
      object-annotations:
        needs:
        - format
      triple-quotes:
        needs:
        - format
      no-comments:
        needs:
        - format
      lint:
        needs:
        - suppressions
        - triple-quotes
        - no-comments
      type:
        needs:
        - object-annotations
      analyze:
        needs:
        - lint
        - type
      time-bombs:
        needs:
        - analyze
      test-fast:
        needs:
        - time-bombs
      test-medium:
        needs:
        - time-bombs
      coverage:
        needs:
        - test-fast
        - test-medium
      flaky-python:
        needs:
        - coverage
      mutation:
        needs:
        - flaky-python
      audit:
        needs:
        - mutation
      package:
        needs:
        - audit
  release:
    trigger:
      push:
        tags:
        - v[0-9]+.[0-9]+.[0-9]+
    execution: github-actions
    dependencies: graph
    concurrency: release-publishing
    presentation: release
    nodes:
      build:
        operation: release-build
      publish-core:
        needs:
        - build
      publish-python:
        needs:
        - build
      publish-github:
        needs:
        - build
        - publish-core
      publish-cli:
        needs:
        - build
        - publish-core
      release:
        operation: github-release
        needs:
        - publish-core
        - publish-python
        - publish-github
        - publish-cli
