[tool.uv.workspace]
members = ["packages/core", "packages/github", "packages/python", "apps/qg"]
exclude = ["examples/*"]

[dependency-groups]
format = ["mdformat>=0.7.22", "ruff==0.15.22"]
lint = [
  "codespell>=2.4.1",
  "mdformat>=0.7.22",
  "ruff==0.15.22",
  "shellcheck-py==0.11.0.1",
  "yamllint>=1.37.1",
]
type = [
  "mypy>=1.18.2",
  "types-defusedxml>=0.7.0.20250822",
  "types-pyyaml>=6.0.12.20250915",
]
test = ["diff-cover>=10.4.1", "pytest>=9.0.2", "pytest-cov>=7.0.0"]
analyze = ["bandit>=1.8.6", "semgrep>=1.136.0", "vulture>=2.14"]
audit = ["pip-audit>=2.10.0"]
package = ["check-wheel-contents>=0.6.3", "twine>=6.2.0"]
mutation = [{ include-group = "test" }, "mutmut>=3.4.0"]
dev = [
  { include-group = "analyze" },
  { include-group = "audit" },
  { include-group = "format" },
  { include-group = "lint" },
  { include-group = "mutation" },
  { include-group = "package" },
  { include-group = "test" },
  { include-group = "type" },
  "mkdocs>=1.6,<2",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = ["integration: exercises a real local external dependency"]

[tool.coverage.run]
branch = true
source = ["quality_graph_core", "qg_github", "qg_cli", "qg_python"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
  "packages/core/src",
  "packages/github/src",
  "packages/python/src",
  "apps/qg/src",
  "tests",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D203", "D212"]

[tool.ruff.lint.isort]
known-first-party = ["quality_graph_core", "qg_github", "qg_cli", "qg_python"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "PLR2004", "S101"]
"tests/integration/test_formatter_contract.py" = ["S603"]

[tool.mypy]
python_version = "3.12"
files = [
  "packages/core/src",
  "packages/github/src",
  "packages/python/src",
  "apps/qg/src",
  "scripts",
]
mypy_path = [
  "packages/core/src",
  "packages/github/src",
  "packages/python/src",
  "apps/qg/src",
]
strict = true
warn_unreachable = true
extra_checks = true
explicit_package_bases = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_any_explicit = true
disallow_any_unimported = true
disallow_any_decorated = true
warn_return_any = true
enable_error_code = [
  "explicit-override",
  "ignore-without-code",
  "mutable-override",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "mutants"]

[tool.vulture]
paths = ["packages/core/src", "packages/github/src", "packages/python/src", "apps/qg/src"]
exclude = ["*/.venv/*", "*/build/*", "*/mutants/*"]
min_confidence = 80

[tool.mutmut]
source_paths = [
  "packages/core/src/quality_graph_core",
  "packages/github/src/qg_github",
  "packages/python/src/qg_python",
]
only_mutate = [
  "packages/github/src/qg_github/compiler.py",
  "packages/github/src/qg_github/commands.py",
  "packages/core/src/quality_graph_core/graph.py",
  "packages/core/src/quality_graph_core/policy.py",
  "packages/core/src/quality_graph_core/result.py",
  "packages/python/src/qg_python/object_annotations.py",
  "packages/python/src/qg_python/suppressions.py",
  "packages/python/src/qg_python/time_bombs.py",
  "packages/python/src/qg_python/triple_quotes.py",
]
also_copy = [
  ".github",
  "apps",
  "tests",
  "scripts",
  "examples",
  "schemas",
  "docs",
  "action.yml",
  "LICENSE",
  "README.md",
  "qg.yaml",
  "packages/core/pyproject.toml",
  "packages/core/README.md",
  "packages/github/pyproject.toml",
  "packages/github/README.md",
  "packages/python/pyproject.toml",
  "packages/python/README.md",
]
pytest_add_cli_args = ["-q", "-m", "not integration"]
do_not_mutate_patterns = ["^\\s*message ="]
