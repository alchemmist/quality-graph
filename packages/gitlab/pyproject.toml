[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "quality-graph-gitlab"
version = "0.1.10"
description = "GitLab provider and CI runtime for Quality Graph"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "anyio>=4.0",
  "httpx>=0.28.1",
  "pyyaml>=6.0.2",
  "quality-graph-core==0.1.10",
]

[project.urls]
Homepage = "https://quality-graph.xyz/"
Documentation = "https://quality-graph.xyz/"

[project.entry-points."qg.providers"]
gitlab = "qg_gitlab:provider"

[project.scripts]
qg-gitlab = "qg_gitlab.runtime:main"

[tool.uv.sources]
quality-graph-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/qg_gitlab"]
