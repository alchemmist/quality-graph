[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "quality-graph-github"
version = "0.1.2"
description = "GitHub provider and Action runtime for Quality Graph"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "pyyaml>=6.0.2",
  "quality-graph-core==0.1.2",
]

[project.entry-points."qg.providers"]
github = "qg_github:provider"

[tool.uv.sources]
quality-graph-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/qg_github"]
