# Generated by Quality Graph. Do not edit.
---
name: Quality Graph
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: quality-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: 'false'
    - uses: astral-sh/setup-uv@v7
    - run: uv sync --locked
    - run: bash scripts/lint.sh
      name: Run Ruff
      id: quality-command
      continue-on-error: true
    - name: Collect Ruff result
      id: quality-result
      if: always()
      uses: alchemmist/quality-graph@c7522e4fecd84011a36153bd123e2d3b32dac9c2
      with:
        operation: collect
        node-id: lint
        title: Ruff
        adapter: sarif
        report-path: reports/ruff.sarif
        command-outcome: ${{ steps.quality-command.outcome }}
        graph-digest: 0eae8d8033a6908c8599ba9c7590bc426ad015c71853a2e1800c85d6b5f6d142
    - name: Upload Ruff result
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: quality-result-lint-${{ github.run_attempt }}
        path: ${{ runner.temp }}/quality-graph/lint.json
        if-no-files-found: error
        retention-days: 7
    - name: Enforce Ruff result
      if: always()
      shell: bash
      env:
        EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
      run: exit "${EXIT_CODE:-2}"
  test:
    name: Pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: 'false'
    - uses: astral-sh/setup-uv@v7
    - run: uv sync --locked
    - run: bash scripts/test.sh
      name: Run Pytest
      id: quality-command
      continue-on-error: true
    - name: Collect Pytest result
      id: quality-result
      if: always()
      uses: alchemmist/quality-graph@c7522e4fecd84011a36153bd123e2d3b32dac9c2
      with:
        operation: collect
        node-id: test
        title: Pytest
        adapter: junit
        report-path: reports/pytest.xml
        command-outcome: ${{ steps.quality-command.outcome }}
        graph-digest: 0eae8d8033a6908c8599ba9c7590bc426ad015c71853a2e1800c85d6b5f6d142
    - name: Upload Pytest result
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: quality-result-test-${{ github.run_attempt }}
        path: ${{ runner.temp }}/quality-graph/test.json
        if-no-files-found: error
        retention-days: 7
    - name: Enforce Pytest result
      if: always()
      shell: bash
      env:
        EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
      run: exit "${EXIT_CODE:-2}"
    needs:
    - lint
