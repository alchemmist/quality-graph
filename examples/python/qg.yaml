---
version: 0
provider:
  name: github
  configuration:
    default-branch: main
    runtime:
      action: alchemmist/quality-graph@55bd4872cbeb88d7d3ae6fc29ddd1c1aa481d4bd
execution:
  pull-request:
    dependencies: graph
  push:
    dependencies: none
profiles:
  default:
    runner: ubuntu-latest
    setup:
      - uses: actions/checkout@v7
        with:
          persist-credentials: "false"
          fetch-depth: "0"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
nodes:
  lint:
    title: Ruff
    run: bash scripts/lint.sh
    results:
      sarif: reports/ruff.sarif
  test:
    title: Pytest
    needs: [lint]
    run: bash scripts/test.sh
    results:
      junit: reports/pytest.xml
  diff:
    title: Diff check
    events: [pull-request]
    needs: [test]
    run: git diff --check origin/main...HEAD
