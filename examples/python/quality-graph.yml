---
version: 0
provider:
  name: github
  configuration:
    default-branch: main
    runtime:
      action: alchemmist/quality-graph@240cf2504a8cf4c9d75cd672c173568732a6a65d
      publisher-action: alchemmist/quality-graph@9f813fbdcfbcd92b8cc0a272fb2c4f8ce23e1188
profiles:
  default:
    runner: ubuntu-latest
    setup:
      - uses: actions/checkout@v7
        with:
          persist-credentials: "false"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
nodes:
  lint:
    title: Ruff
    run: bash scripts/lint.sh
    results:
      sarif: reports/ruff.sarif
  test:
    title: Pytest
    needs: [lint]
    run: bash scripts/test.sh
    results:
      junit: reports/pytest.xml
