---
version: 0
provider: github
runtime:
  action: alchemmist/quality-graph@1c69de93a83157fde21a0a3beaf14d13d111016e
profiles:
  default:
    runner: ubuntu-latest
    setup:
      - uses: actions/checkout@v7
        with:
          persist-credentials: "false"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
nodes:
  lint:
    title: Ruff
    run: bash scripts/lint.sh
    results:
      sarif: reports/ruff.sarif
  test:
    title: Pytest
    needs: [lint]
    run: bash scripts/test.sh
    results:
      junit: reports/pytest.xml
