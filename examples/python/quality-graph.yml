---
version: 0
provider:
  name: github
  configuration:
    runtime:
      action: alchemmist/quality-graph@cba464e01e2a0b2eb470d4eb9fc107ee1ad71128
profiles:
  default:
    runner: ubuntu-latest
    setup:
      - uses: actions/checkout@v7
        with:
          persist-credentials: "false"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
nodes:
  lint:
    title: Ruff
    run: bash scripts/lint.sh
    results:
      sarif: reports/ruff.sarif
  test:
    title: Pytest
    needs: [lint]
    run: bash scripts/test.sh
    results:
      junit: reports/pytest.xml
