# Generated by Quality Graph. DO NOT EDIT MANUALLY.
---
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
    when: never
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
  - when: never
stages:
- quality
default:
  image: python:3.12-slim
  tags:
  - qg-execution
  before_script:
  - python -m pip install --disable-pip-version-check quality-graph-gitlab==0.1.10
qg:mr:test:
  stage: quality
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      == "main"
  needs: []
  script:
  - qg-gitlab execute --flow mr --node test
  artifacts:
    when: always
    paths:
    - .qg/results/mr/test.json
    expire_in: 7 days
  interruptible: true
  image: python:3.12-slim
  allow_failure:
    exit_codes:
    - 10
qg-internal:admission:mr:
  stage: quality
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      == "main"
  needs: []
  script:
  - qg-gitlab gate --flow mr
  timeout: 5 minutes
  interruptible: true
qg:push:test:
  stage: quality
  rules:
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
  needs: []
  script:
  - qg-gitlab execute --flow push --node test
  artifacts:
    when: always
    paths:
    - .qg/results/push/test.json
    expire_in: 7 days
  interruptible: true
  image: python:3.12-slim
