---
version: 0
provider:
  name: github
  configuration:
    runtime:
      action: alchemmist/quality-graph@1c69de93a83157fde21a0a3beaf14d13d111016e
profiles:
  default:
    runner: ubuntu-latest
    setup:
      - uses: actions/checkout@v7
        with:
          persist-credentials: "false"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: "true"
nodes:
  vet:
    title: Go vet
    run: go vet ./...
  test:
    title: Go test
    needs: [vet]
    run: go test ./...
