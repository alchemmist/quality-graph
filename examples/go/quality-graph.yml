---
version: 0
provider:
  name: github
  configuration:
    runtime:
      action: alchemmist/quality-graph@240cf2504a8cf4c9d75cd672c173568732a6a65d
      publisher-action: alchemmist/quality-graph@cba464e01e2a0b2eb470d4eb9fc107ee1ad71128
profiles:
  default:
    runner: ubuntu-latest
    setup:
      - uses: actions/checkout@v7
        with:
          persist-credentials: "false"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: "true"
nodes:
  vet:
    title: Go vet
    run: go vet ./...
  test:
    title: Go test
    needs: [vet]
    run: go test ./...
