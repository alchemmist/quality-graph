# Generated by Quality Graph. DO NOT EDIT MANUALLY. Update qg.yaml and run qg generate.
---
name: Quality Graph
'on':
  pull_request:
    branches:
      - trunk
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: quality-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vet:
    name: Go vet
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: 'false'
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: 'true'
      - run: go vet ./...
        name: Run Go vet
        id: quality-command
        continue-on-error: true
      - name: Collect Go vet result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@55bd4872cbeb88d7d3ae6fc29ddd1c1aa481d4bd
        with:
          operation: collect
          node-id: vet
          title: Go vet
          adapter: exit-code
          report-path: ''
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: 570f9b2d04f6bacb82394b2b38a7d0db33a7659a1d8e2d503f1c1f795d0b910b
          approval-findings: 'true'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload Go vet result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-result-vet-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/vet.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Go vet result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
  test:
    name: Go test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: 'false'
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: 'true'
      - run: go test ./...
        name: Run Go test
        id: quality-command
        continue-on-error: true
      - name: Collect Go test result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@55bd4872cbeb88d7d3ae6fc29ddd1c1aa481d4bd
        with:
          operation: collect
          node-id: test
          title: Go test
          adapter: exit-code
          report-path: ''
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: 570f9b2d04f6bacb82394b2b38a7d0db33a7659a1d8e2d503f1c1f795d0b910b
          approval-findings: 'true'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload Go test result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-result-test-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/test.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Go test result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
    needs:
      - vet
