# Generated by Quality Graph. Do not edit.
---
name: Quality Graph
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: quality-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vet:
    name: Go vet
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: 'false'
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: 'true'
    - run: go vet ./...
      name: Run Go vet
      id: quality-command
      continue-on-error: true
    - name: Collect Go vet result
      id: quality-result
      if: always()
      uses: alchemmist/quality-graph@c7522e4fecd84011a36153bd123e2d3b32dac9c2
      with:
        operation: collect
        node-id: vet
        title: Go vet
        adapter: exit-code
        report-path: ''
        command-outcome: ${{ steps.quality-command.outcome }}
        graph-digest: acce954c2edc200087eecc4e4ea9dee267a20e8607e50c631268ee5268e67fdd
    - name: Upload Go vet result
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: quality-result-vet-${{ github.run_attempt }}
        path: ${{ runner.temp }}/quality-graph/vet.json
        if-no-files-found: error
        retention-days: 7
    - name: Enforce Go vet result
      if: always()
      shell: bash
      env:
        EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
      run: exit "${EXIT_CODE:-2}"
  test:
    name: Go test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: 'false'
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: 'true'
    - run: go test ./...
      name: Run Go test
      id: quality-command
      continue-on-error: true
    - name: Collect Go test result
      id: quality-result
      if: always()
      uses: alchemmist/quality-graph@c7522e4fecd84011a36153bd123e2d3b32dac9c2
      with:
        operation: collect
        node-id: test
        title: Go test
        adapter: exit-code
        report-path: ''
        command-outcome: ${{ steps.quality-command.outcome }}
        graph-digest: acce954c2edc200087eecc4e4ea9dee267a20e8607e50c631268ee5268e67fdd
    - name: Upload Go test result
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: quality-result-test-${{ github.run_attempt }}
        path: ${{ runner.temp }}/quality-graph/test.json
        if-no-files-found: error
        retention-days: 7
    - name: Enforce Go test result
      if: always()
      shell: bash
      env:
        EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
      run: exit "${EXIT_CODE:-2}"
    needs:
    - vet
