---
version: 0
provider:
  name: github
  configuration:
    default-branch: trunk
    runtime:
      action: alchemmist/quality-graph@240cf2504a8cf4c9d75cd672c173568732a6a65d
      publisher-action: alchemmist/quality-graph@9f813fbdcfbcd92b8cc0a272fb2c4f8ce23e1188
profiles:
  default:
    runner: ubuntu-latest
    setup:
      - uses: actions/checkout@v7
        with:
          persist-credentials: "false"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: "true"
nodes:
  vet:
    title: Go vet
    run: go vet ./...
  test:
    title: Go test
    needs: [vet]
    run: go test ./...
