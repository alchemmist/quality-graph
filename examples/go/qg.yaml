---
version: 0
provider:
  name: github
  configuration:
    default-branch: trunk
    runtime:
      action: alchemmist/quality-graph@55bd4872cbeb88d7d3ae6fc29ddd1c1aa481d4bd
profiles:
  default:
    runner: ubuntu-latest
    setup:
      - uses: actions/checkout@v7
        with:
          persist-credentials: "false"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: "true"
nodes:
  vet:
    title: Go vet
    run: go vet ./...
  test:
    title: Go test
    needs: [vet]
    run: go test ./...
