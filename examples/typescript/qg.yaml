---
version: 0
provider:
  name: github
  configuration:
    default-branch: main
    runtime:
      action: alchemmist/quality-graph@55bd4872cbeb88d7d3ae6fc29ddd1c1aa481d4bd
profiles:
  default:
    runner: ubuntu-latest
    setup:
      - uses: actions/checkout@v7
        with:
          persist-credentials: "false"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
nodes:
  type:
    title: TypeScript
    run: npm run typecheck
  test:
    title: Vitest
    needs: [type]
    run: mkdir -p reports && npm test -- --reporter=junit --outputFile=reports/vitest.xml
    results:
      junit: reports/vitest.xml
