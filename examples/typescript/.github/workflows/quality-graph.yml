# Generated by Quality Graph. Do not edit.
---
name: Quality Graph
'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: quality-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  type:
    name: TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: 'false'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
        name: Run TypeScript
        id: quality-command
        continue-on-error: true
      - name: Collect TypeScript result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@cba464e01e2a0b2eb470d4eb9fc107ee1ad71128
        with:
          operation: collect
          node-id: type
          title: TypeScript
          adapter: exit-code
          report-path: ''
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: f8bfd15b10663798613e039e7f08f6bd77f7e0641e95d9a190c8c1b997a46762
          approval-findings: 'true'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload TypeScript result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-result-type-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/type.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce TypeScript result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
  test:
    name: Vitest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: 'false'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: mkdir -p reports && npm test -- --reporter=junit --outputFile=reports/vitest.xml
        name: Run Vitest
        id: quality-command
        continue-on-error: true
      - name: Collect Vitest result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@cba464e01e2a0b2eb470d4eb9fc107ee1ad71128
        with:
          operation: collect
          node-id: test
          title: Vitest
          adapter: junit
          report-path: reports/vitest.xml
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: f8bfd15b10663798613e039e7f08f6bd77f7e0641e95d9a190c8c1b997a46762
          approval-findings: 'true'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload Vitest result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-result-test-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/test.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Vitest result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
    needs:
      - type
