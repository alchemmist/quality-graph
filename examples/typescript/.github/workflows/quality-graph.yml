# Generated by Quality Graph. Do not edit.
---
name: Quality Graph
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: quality-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  type:
    name: TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: 'false'
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - run: npm run typecheck
      name: Run TypeScript
      id: quality-command
      continue-on-error: true
    - name: Collect TypeScript result
      id: quality-result
      if: always()
      uses: alchemmist/quality-graph@1c69de93a83157fde21a0a3beaf14d13d111016e
      with:
        operation: collect
        node-id: type
        title: TypeScript
        adapter: exit-code
        report-path: ''
        command-outcome: ${{ steps.quality-command.outcome }}
        graph-digest: 976ebe75ed71396e01eb746d2c28177e02037fa8ab8a4e51e5f3aa9ff854fe92
    - name: Upload TypeScript result
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: quality-result-type-${{ github.run_attempt }}
        path: ${{ runner.temp }}/quality-graph/type.json
        if-no-files-found: error
        retention-days: 7
    - name: Enforce TypeScript result
      if: always()
      shell: bash
      env:
        EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
      run: exit "${EXIT_CODE:-2}"
  test:
    name: Vitest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: 'false'
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - run: mkdir -p reports && npm test -- --reporter=junit --outputFile=reports/vitest.xml
      name: Run Vitest
      id: quality-command
      continue-on-error: true
    - name: Collect Vitest result
      id: quality-result
      if: always()
      uses: alchemmist/quality-graph@1c69de93a83157fde21a0a3beaf14d13d111016e
      with:
        operation: collect
        node-id: test
        title: Vitest
        adapter: junit
        report-path: reports/vitest.xml
        command-outcome: ${{ steps.quality-command.outcome }}
        graph-digest: 976ebe75ed71396e01eb746d2c28177e02037fa8ab8a4e51e5f3aa9ff854fe92
    - name: Upload Vitest result
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: quality-result-test-${{ github.run_attempt }}
        path: ${{ runner.temp }}/quality-graph/test.json
        if-no-files-found: error
        retention-days: 7
    - name: Enforce Vitest result
      if: always()
      shell: bash
      env:
        EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
      run: exit "${EXIT_CODE:-2}"
    needs:
    - type
