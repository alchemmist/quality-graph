---
version: 0
provider:
  name: github
  configuration:
    runtime:
      action: alchemmist/quality-graph@1c69de93a83157fde21a0a3beaf14d13d111016e
profiles:
  default:
    runner: ubuntu-latest
    setup:
      - uses: actions/checkout@v7
        with:
          persist-credentials: "false"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
nodes:
  type:
    title: TypeScript
    run: npm run typecheck
  test:
    title: Vitest
    needs: [type]
    run: mkdir -p reports && npm test -- --reporter=junit --outputFile=reports/vitest.xml
    results:
      junit: reports/vitest.xml
