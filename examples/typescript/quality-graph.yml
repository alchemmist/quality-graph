---
version: 0
provider:
  name: github
  configuration:
    runtime:
      action: alchemmist/quality-graph@240cf2504a8cf4c9d75cd672c173568732a6a65d
      publisher-action: alchemmist/quality-graph@9f813fbdcfbcd92b8cc0a272fb2c4f8ce23e1188
profiles:
  default:
    runner: ubuntu-latest
    setup:
      - uses: actions/checkout@v7
        with:
          persist-credentials: "false"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
nodes:
  type:
    title: TypeScript
    run: npm run typecheck
  test:
    title: Vitest
    needs: [type]
    run: mkdir -p reports && npm test -- --reporter=junit --outputFile=reports/vitest.xml
    results:
      junit: reports/vitest.xml
