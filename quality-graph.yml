---
version: 0
provider:
  name: github
  configuration:
    runtime:
      action: alchemmist/quality-graph@1c69de93a83157fde21a0a3beaf14d13d111016e

profiles:
  default:
    runner: ubuntu-latest
    setup:
      - uses: actions/checkout@v7
        with:
          persist-credentials: "false"
          fetch-depth: "0"

  python:
    extends: default
    setup:
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: "true"
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --all-groups

nodes:
  format:
    title: Format check
    profile: python
    run: make fmt-check

  lint:
    title: Lint
    profile: python
    needs: [format]
    run: make lint

  type:
    title: Type check
    profile: python
    needs: [lint]
    run: make type

  analyze:
    title: Static analysis
    profile: python
    needs: [type]
    run: make analyze

  test:
    title: Tests and coverage
    profile: python
    needs: [analyze]
    run: make coverage

  mutation:
    title: Changed decision mutation gate
    profile: python
    needs: [test]
    run: make mutation-diff

  audit:
    title: Dependency and secret audit
    profile: python
    needs: [mutation]
    run: make audit

  package:
    title: Package
    profile: python
    needs: [audit]
    run: make package
