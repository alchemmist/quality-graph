---
version: 0
provider:
  name: github
  configuration:
    default-branch: main
    runtime:
      action: alchemmist/quality-graph@240cf2504a8cf4c9d75cd672c173568732a6a65d
      publisher-action: alchemmist/quality-graph@9f813fbdcfbcd92b8cc0a272fb2c4f8ce23e1188

profiles:
  default:
    runner: ubuntu-latest
    setup:
      - uses: actions/checkout@v7
        with:
          persist-credentials: "false"
          fetch-depth: "0"

  python:
    extends: default
    setup:
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: "true"
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --all-groups --all-packages

nodes:
  format:
    title: Format check
    profile: python
    run: make fmt-check

  suppressions:
    title: Lint suppression gate
    profile: python
    needs: [format]
    run: make python-suppressions

  object-annotations:
    title: Python object annotation gate
    profile: python
    needs: [format]
    run: make python-object-annotations

  triple-quotes:
    title: Triple-quoted string style
    profile: python
    needs: [format]
    run: make python-triple-quotes

  no-comments:
    title: Python no-comments policy
    profile: python
    needs: [format]
    run: make python-no-comments

  lint:
    title: Lint
    profile: python
    needs: [suppressions, triple-quotes, no-comments]
    run: make lint

  type:
    title: Type check
    profile: python
    needs: [object-annotations]
    run: make type

  analyze:
    title: Static analysis
    profile: python
    needs: [lint, type]
    run: make analyze

  time-bombs:
    title: Time bomb guardrail
    profile: python
    needs: [analyze]
    run: make python-time-bombs

  test-unit:
    title: Unit tests
    profile: python
    needs: [time-bombs]
    run: make test-unit

  test-integration:
    title: Integration tests
    profile: python
    needs: [time-bombs]
    run: make test-integration

  coverage:
    title: Coverage and diff coverage
    profile: python
    needs: [test-unit, test-integration]
    run: make coverage-diff

  flaky-python:
    title: Changed Python flaky-test detection
    profile: python
    needs: [coverage]
    run: make flaky-python

  mutation:
    title: Changed decision mutation gate
    profile: python
    needs: [flaky-python]
    run: make mutation-diff

  audit:
    title: Dependency and secret audit
    profile: python
    needs: [mutation]
    run: make audit

  package:
    title: Package
    profile: python
    needs: [audit]
    run: make package
